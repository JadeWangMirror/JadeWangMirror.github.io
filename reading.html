<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading List — JadeWang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* Tag filter bar */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.2,0.8,0.2,1) 0.2s forwards;
  }
  .filter-sub {
    margin-bottom: 0.6rem;
    display: none;
  }
  .filter-sub.visible { display: flex; }
  .filter-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 0.4rem 0.85rem;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: #c5c8d8;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover {
    background: rgba(124,109,250,0.1);
    border-color: rgba(124,109,250,0.3);
    color: var(--text);
  }
  .filter-btn.active {
    background: rgba(124,109,250,0.2);
    border-color: rgba(124,109,250,0.5);
    color: #fff;
    box-shadow: 0 0 12px rgba(124,109,250,0.15);
  }

  /* Paper list */
  .paper-list {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.2,0.8,0.2,1) 0.3s forwards;
  }
  .paper-item {
    display: grid;
    grid-template-columns: 60px 1fr auto;
    gap: 1.5rem;
    align-items: baseline;
    padding: 1.3rem 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
    transition: padding 0.2s, color 0.2s;
  }
  .paper-item:hover { padding-left: 0.8rem; }
  .paper-item:hover .paper-title { color: var(--accent); }
  .paper-item:hover .paper-arrow { opacity: 1; transform: translateX(0); }
  .paper-item.hidden { display: none; }

  .paper-year {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .paper-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    transition: color 0.2s;
    line-height: 1.4;
  }
  .paper-authors {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }
  .paper-tags {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.4rem;
    flex-wrap: wrap;
  }
  .paper-tag {
    font-family: 'Inter', sans-serif;
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    background: rgba(124,109,250,0.1);
    color: var(--accent);
    border: 1px solid rgba(124,109,250,0.15);
  }
  .paper-arrow {
    font-size: 0.9rem;
    color: var(--accent);
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity 0.25s, transform 0.25s;
  }

  .paper-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    margin-bottom: 1rem;
    letter-spacing: 0.03em;
  }

  @media (max-width: 600px) {
    .paper-item { grid-template-columns: 1fr; gap: 0.3rem; padding: 1rem 0; }
    .paper-item:hover { padding-left: 0; }
    .paper-arrow { display: none; }
    .paper-year { display: inline; margin-right: 0.5rem; }
  }
</style>
</head>
<body>
<div id="progress-bar"></div>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<nav>
  <div class="nav-logo">JadeWang</div>
  <div class="nav-toggle" id="navToggle">
    <span></span><span></span><span></span>
  </div>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html">Home</a></li>
    <li><a href="blog.html">Blog</a></li>
    <li><a href="reading.html" class="active">Reading List</a></li>
  </ul>
  <div class="nav-overlay" id="navOverlay"></div>
</nav>

<main class="page">
  <div class="page-header">
    <div class="page-eyebrow">Reading List</div>
    <h1 class="page-title">Papers I liked</h1>
    <p class="page-sub">Research that shaped how I think. Updated occasionally.</p>
  </div>

  <!-- Filter levels -->
  <div class="filter-bar" id="filterCat"></div>
  <div class="filter-bar filter-sub" id="filterYear"></div>
  <div class="filter-bar filter-sub" id="filterMonth"></div>
  <div class="paper-count" id="paperCount"></div>
  <div class="paper-list" id="paperList"></div>
</main>

<footer>
  <p>© 2026 JadeWang</p>
  <div class="footer-links">
    <a href="https://github.com/JadeWangMirror" target="_blank">GitHub</a>
    <a href="#">Twitter</a>
    <a href="#">Email</a>
  </div>
</footer>

<script src="app.js"></script>
<script>
(function () {
  var filterCat = document.getElementById('filterCat');
  var filterYear = document.getElementById('filterYear');
  var filterMonth = document.getElementById('filterMonth');
  var paperList = document.getElementById('paperList');
  var paperCount = document.getElementById('paperCount');

  var papers = [];
  var activeCat = null;
  var activeYear = null;
  var activeMonth = null;

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  fetch('reading-data.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      papers = data.sort(function (a, b) { return b.year - a.year || b.month - a.month; });
      buildCatFilter();
      buildYearFilter();
      renderPapers();
    })
    .catch(function () {
      paperList.innerHTML = '<p style="color:var(--muted);padding:2rem 0;">Cannot load reading list. Try <a href="https://jadewangmirror.github.io/reading.html" style="color:var(--accent)">GitHub Pages</a>.</p>';
    });

  function buildCatFilter() {
    var cats = {};
    papers.forEach(function (p) {
      var c = Array.isArray(p.category) ? p.category : [p.category];
      c.forEach(function (t) { cats[t] = true; });
    });
    filterCat.innerHTML = '';
    addBtn(filterCat, 'All', null, activeCat === null, function () { activeCat = null; activeYear = null; activeMonth = null; buildYearFilter(); buildMonthFilter(); renderPapers(); });
    Object.keys(cats).sort().forEach(function (cat) {
      addBtn(filterCat, cat, cat, activeCat === cat, function () { activeCat = cat; activeYear = null; activeMonth = null; buildYearFilter(); buildMonthFilter(); renderPapers(); });
    });
  }

  function buildYearFilter() {
    filterYear.innerHTML = '';
    filterYear.classList.remove('visible');
    var years = {};
    filtered(activeCat, null, null).forEach(function (p) { years[p.year] = true; });
    var sorted = Object.keys(years).sort(function (a, b) { return b - a; });
    if (sorted.length <= 1) {
      activeYear = sorted[0] || null;
      buildMonthFilter();
      return;
    }
    addBtn(filterYear, 'All years', null, activeYear === null, function () { activeYear = null; activeMonth = null; buildMonthFilter(); renderPapers(); });
    sorted.forEach(function (y) {
      addBtn(filterYear, y, y, activeYear == y, function () { activeYear = y; activeMonth = null; buildMonthFilter(); renderPapers(); });
    });
    filterYear.classList.add('visible');
  }

  function buildMonthFilter() {
    filterMonth.innerHTML = '';
    filterMonth.classList.remove('visible');
    var effectiveYear = activeYear;
    var pool = filtered(activeCat, effectiveYear, null);
    var months = {};
    pool.forEach(function (p) { months[p.month] = true; });
    var sorted = Object.keys(months).sort(function (a, b) { return a - b; });
    if (sorted.length <= 1) return;
    addBtn(filterMonth, 'All months', null, activeMonth === null, function () { activeMonth = null; renderPapers(); });
    sorted.forEach(function (m) {
      addBtn(filterMonth, MONTHS[m - 1], m, activeMonth == m, function () { activeMonth = m; renderPapers(); });
    });
    filterMonth.classList.add('visible');
  }

  function filtered(cat, year, month) {
    return papers.filter(function (p) {
      if (cat) {
        var c = Array.isArray(p.category) ? p.category : [p.category];
        if (c.indexOf(cat) === -1) return false;
      }
      if (year && p.year != year) return false;
      if (month && p.month != month) return false;
      return true;
    });
  }

  function renderPapers() {
    var list = filtered(activeCat, activeYear, activeMonth);
    paperCount.textContent = list.length + ' paper' + (list.length !== 1 ? 's' : '');
    paperList.innerHTML = '';
    list.forEach(function (p) {
      var a = document.createElement('a');
      a.className = 'paper-item';
      a.href = p.url;
      a.target = '_blank';
      a.innerHTML =
        '<div class="paper-year">' + p.year + '.' + (p.month < 10 ? '0' : '') + p.month + '</div>' +
        '<div>' +
          '<div class="paper-title">' + p.title + '</div>' +
          '<div class="paper-authors">' + p.authors + '</div>' +
          '<div class="paper-tags">' + (Array.isArray(p.category) ? p.category : [p.category]).map(function (t) { return '<span class="paper-tag">' + t + '</span>'; }).join('') + '</div>' +
        '</div>' +
        '<div class="paper-arrow">→</div>';
      paperList.appendChild(a);
    });
    // Update button active states
    updateBtns(filterCat, activeCat);
    updateBtns(filterYear, activeYear);
    updateBtns(filterMonth, activeMonth);
  }

  function addBtn(bar, label, value, isActive, onClick) {
    var btn = document.createElement('button');
    btn.className = 'filter-btn' + (isActive ? ' active' : '');
    btn.textContent = label;
    btn.dataset.value = value || '';
    btn.addEventListener('click', onClick);
    bar.appendChild(btn);
  }

  function updateBtns(bar, activeValue) {
    bar.querySelectorAll('.filter-btn').forEach(function (btn) {
      var v = btn.dataset.value;
      btn.classList.toggle('active', v === '' ? activeValue === null : v == activeValue);
    });
  }
})();
</script>
</body>
</html>
